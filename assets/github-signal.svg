<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Voldi Mbayo GitHub signal</title>
  <desc id="desc">A visual dashboard linking to official GitHub activity without displaying cached third-party statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#ff5a67"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="95" cy="82" r="8" fill="#ef233c" filter="url(#glow)"/>
  <text x="120" y="92" fill="#f0f6fc" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="4">LIVE GITHUB SIGNAL</text>
  <text x="70" y="160" fill="#8b949e" font-family="monospace" font-size="16">PROFILE</text>
  <text x="70" y="195" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">voldimbayo-blip</text>
  <path d="M410 235 C465 235 470 135 525 135 S585 275 640 275 700 165 755 165 815 225 870 225 930 105 985 105 1040 185 1130 185" fill="none" stroke="#ef233c" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M410 235 C465 235 470 135 525 135 S585 275 640 275 700 165 755 165 815 225 870 225 930 105 985 105 1040 185 1130 185" fill="none" stroke="url(#red)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="525" cy="135" r="7" fill="#ffffff"/>
  <circle cx="755" cy="165" r="7" fill="#ffffff"/>
  <circle cx="985" cy="105" r="7" fill="#ffffff"/>
  <rect x="70" y="250" width="250" height="48" rx="24" fill="#ef233c"/>
  <text x="195" y="281" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">OFFICIAL ACTIVITY</text>
  <text x="410" y="325" fill="#8b949e" font-family="monospace" font-size="14">PUBLIC PROFILE  •  PRIVATE CONTRIBUTIONS  •  SOURCE: GITHUB</text>
</svg>