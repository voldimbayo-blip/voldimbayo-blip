<svg width="1000" height="380" viewBox="0 0 1000 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#071A10"/>
    </linearGradient>
    <linearGradient id="accent" x1="118" y1="0" x2="806" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A"/>
      <stop offset="0.5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22C55E" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 4s linear infinite; }
      .blink { animation: blink 1s steps(2,end) infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes scan { from { transform:translateY(-30px) } to { transform:translateY(410px) } }
      @keyframes blink { 50% { opacity:0 } }
      @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-7px) } }
      @media (prefers-reduced-motion: reduce) { * { animation:none !important } }
    </style>
  </defs>
  <rect width="1000" height="380" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="378" rx="17" stroke="#22C55E" stroke-opacity="0.55" stroke-width="2"/>
  <rect width="1000" height="380" rx="18" fill="url(#grid)"/>
  <path d="M0 76H1000" stroke="#334155"/>
  <circle cx="34" cy="38" r="7" fill="#EF4444"/>
  <circle cx="59" cy="38" r="7" fill="#F59E0B"/>
  <circle cx="84" cy="38" r="7" fill="#22C55E" class="pulse"/>
  <text x="120" y="45" fill="#94A3B8" font-family="monospace" font-size="17">voldi@havenlabs: ~/profile/dashboard</text>
  <g class="float">
    <rect x="62" y="112" width="92" height="92" rx="12" fill="#0E1223" stroke="#22C55E" stroke-width="2"/>
    <path d="M88 137H128V149H100V161H124V173H100V187H88V137Z" fill="url(#accent)"/>
    <path d="M130 137H142V187H130V137Z" fill="#4ADE80"/>
  </g>
  <text x="188" y="145" fill="#94A3B8" font-family="monospace" font-size="17" letter-spacing="3">FULL-STACK + MOBILE DEVELOPER</text>
  <text x="185" y="210" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2">VOLDI MBAYO</text>
  <rect x="188" y="229" width="520" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)"/>
  <text x="188" y="273" fill="#CBD5E1" font-family="monospace" font-size="19">Building digital products that move ideas forward</text>
  <rect x="188" y="302" width="190" height="38" rx="6" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E"/>
  <circle cx="213" cy="321" r="6" fill="#22C55E" class="pulse"/>
  <text x="231" y="327" fill="#86EFAC" font-family="monospace" font-size="16" font-weight="700">OPEN TO BUILD</text>
  <rect x="397" y="302" width="210" height="38" rx="6" fill="#0E1223" stroke="#334155"/>
  <text x="418" y="327" fill="#CBD5E1" font-family="monospace" font-size="16">FOUNDER @ HAVENLABS</text>
  <g opacity="0.92">
    <rect x="748" y="113" width="196" height="190" rx="12" fill="#070B12" stroke="#334155"/>
    <text x="770" y="145" fill="#22C55E" font-family="monospace" font-size="15">$ current_focus</text>
    <text x="770" y="180" fill="#E2E8F0" font-family="monospace" font-size="14">01  TalentGrid</text>
    <text x="770" y="213" fill="#E2E8F0" font-family="monospace" font-size="14">02  EK Talk Helper</text>
    <text x="770" y="246" fill="#E2E8F0" font-family="monospace" font-size="14">03  VoFa Link</text>
    <text x="770" y="279" fill="#22C55E" font-family="monospace" font-size="15">ready<span class="blink">_</span></text>
  </g>
  <rect x="0" y="0" width="1000" height="3" fill="#22C55E" opacity="0.35" class="scan"/>
</svg>

